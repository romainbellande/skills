name: Publish Skills

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate skills
        run: gh skill publish --dry-run
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git fetch --tags
          BEFORE=$(git describe --tags --abbrev=0)
          node .github/scripts/generate-release-notes.mjs
          npx semantic-release
          AFTER=$(git describe --tags --abbrev=0)
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "No new version — nothing to publish."
            exit 0
          fi
          echo "TAG=$AFTER" >> "$GITHUB_ENV"

      - name: Publish skills
        if: env.TAG != ''
        run: gh release create "$TAG" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
