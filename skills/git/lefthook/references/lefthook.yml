# Git hook guardrails generated by the setup-lefthook skill.
pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks git --pre-commit --staged --redact --verbose
    lint:
      run: <LINT-COMMAND> {staged_files}
      stage_fixed: true
    format:
      run: <FORMAT-COMMAND> {staged_files}
      stage_fixed: true
commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}
